name: Feature Pipeline (Hourly)

on:
  schedule:
    - cron: "0 * * * *"     # every hour on the hour
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch raw AQI + weather data
        env:
          WAQI_TOKEN:       ${{ secrets.WAQI_TOKEN }}
          OWM_KEY:          ${{ secrets.OWM_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python fetch_data.py

      - name: Engineer features
        run: python feature_engineering.py

      - name: Upload features to Hopsworks Feature Store
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python upload_to_hopsworks.py
