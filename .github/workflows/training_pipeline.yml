name: Training Pipeline (Daily)

on:
  schedule:
    - cron: "0 2 * * *"   # 2:00 AM UTC every day (7:00 AM PKT)
  workflow_dispatch:        # allow manual trigger

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "hopsworks==4.7.*"
          pip install confluent-kafka

      - name: Train models and register champion in Hopsworks
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python train_aqi_model.py

      - name: Run batch inference and generate forecast
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: python batch_inference.py

      - name: Upload prediction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: predictions
          path: predictions/
          retention-days: 7

      - name: Commit and push updated predictions to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/*.csv models/*.png
          git commit -m "Automated sync: update prediction logs and SHAP plot [skip ci]" || echo "No changes to commit"
          git push origin main
